name: Feature request
description: A data source, factor, model, portfolio rule or other capability quantlab lacks.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The research task, and where quantlab stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour or interface you have in mind, and any paper or library it follows.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
