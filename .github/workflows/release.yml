name: Release

# A v* tag publishes to PyPI through trusted publishing (no API token is stored anywhere)
# and creates the GitHub Release. PyPI trusts this file and the pypi environment, so the
# publish job stays here. A manual run only builds and checks.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: The tag names the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }

      - name: The CHANGELOG has a section for the version
        run: grep -q "^## ${GITHUB_REF_NAME#v} (" CHANGELOG.md

      - name: The tagged commit passed CI
        # A release ships only a commit whose CI run succeeded. The tag push starts its
        # own CI run on the same commit, so this waits (up to 90 minutes) for one of the
        # commit's CI runs to succeed, and fails once every run has finished without one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 90); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --json status,conclusion)
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' > /dev/null; then
              echo "CI passed on $GITHUB_SHA"; exit 0
            fi
            if echo "$runs" | jq -e 'length > 0 and all(.[]; .status == "completed")' > /dev/null; then
              echo "no CI run on $GITHUB_SHA succeeded: $runs"; exit 1
            fi
            sleep 60
          done
          echo "CI on $GITHUB_SHA did not finish within 90 minutes"; exit 1

  package:
    needs: gate
    # The gate is skipped on a manual run, and the build still runs.
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    # Only a tag push: a manual run started on a tag is still a check.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quantlab-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Pinned to a commit: this step holds the right to publish.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to a commit: this job holds a token that can write to the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the GitHub Release from the version's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## ${version} (" 'index($0, "## ") == 1 { on = index($0, head) == 1; next } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "quantlab ${version}" --notes-file notes.md --verify-tag
