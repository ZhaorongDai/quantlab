name: CI

# A pull request runs on its merge ref. Pushes run only on main and on release tags, so
# a branch with an open pull request is not tested twice; run a branch without one by
# hand (workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main keeps its run, so a later push cannot leave one untested.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu matches the Linux training server; macos (arm64) matches the dev host,
        # where the darwin-only paths run (OpenMP guard, KunQuant symbol padding).
        os: [ubuntu-latest, macos-latest]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install libomp (macOS)
        # xgboost's macOS wheel links Homebrew's libomp.dylib and does not bundle it.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install the locked environment
        run: uv sync --locked --dev --all-extras

      - name: Test suite
        run: uv run pytest -n auto -q

      - name: API doctests
        run: uv run pytest -q --doctest-modules quantlab/api/

  package:
    uses: ./.github/workflows/package.yml

  changelog:
    # A change to the library is listed in the CHANGELOG, or labelled no-changelog.
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The CHANGELOG lists a change to the library
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          if echo "$changed" | grep -q '^quantlab/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::quantlab/ changed without a CHANGELOG.md entry; add one under Unreleased, or label the pull request no-changelog"
            exit 1
          fi
