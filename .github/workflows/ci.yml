name: CI

# A pull request runs on its merge ref. Pushes run only on main and on release tags, so
# a branch with an open pull request is not tested twice; run a branch without one by
# hand (workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Each commit on main has a group of its own: within a group a newer run cancels the
  # one running and replaces the one pending, which would leave a commit untested.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu matches the Linux training server; macos (arm64) matches the dev host,
        # where the darwin-only paths run (OpenMP guard, KunQuant symbol padding).
        os: [ubuntu-latest, macos-latest]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install libomp (macOS)
        # xgboost's macOS wheel links Homebrew's libomp.dylib and does not bundle it.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install the locked environment
        run: uv sync --locked --dev --all-extras

      - name: Test suite
        run: uv run pytest -n auto -q

      - name: API doctests
        run: uv run pytest -q --doctest-modules quantlab/api/

  package:
    uses: ./.github/workflows/package.yml
