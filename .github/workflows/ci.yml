name: CI

# A pull request runs on its merge ref. Pushes run only on main and on release tags, so
# a branch with an open pull request is not tested twice; run a branch without one by
# hand (workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Each commit on main has a group of its own: within a group a newer run cancels the
  # one running and replaces the one pending, which would leave a commit untested.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu matches the Linux training server; macos (arm64) matches the dev host,
        # where the darwin-only paths run (OpenMP guard, KunQuant symbol padding).
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
      id-token: write  # OIDC upload to Codecov
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install libomp (macOS)
        # xgboost's macOS wheel links Homebrew's libomp.dylib and does not bundle it.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install the locked environment
        run: uv sync --locked --dev --all-extras

      - name: Test suite
        run: uv run pytest -n auto -q --cov=quantlab --cov-report=xml

      - name: Upload coverage to Codecov
        # OIDC authenticates the upload, so the repository needs no Codecov token.
        # Codecov merges the two operating systems' reports into one figure.
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: ${{ runner.os }}
          fail_ci_if_error: false

      - name: API doctests
        run: uv run pytest -q --doctest-modules quantlab/api/

  package:
    uses: ./.github/workflows/package.yml
